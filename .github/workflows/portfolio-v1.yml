name: Portfolio V1 CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-room:
    name: Control-room contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install validation tools
        run: python -m pip install --disable-pip-version-check pytest ruff

      - name: Run Portfolio V1 checks
        run: make portfolio-v1-check
