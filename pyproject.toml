[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "earnings-call-sentiment"
version = "0.1.0"
description = "Deterministic, explainable conversation signal engine for QA and risk detection."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Keith" }]
license = { text = "MIT" }

dependencies = [
  "flask",
  "pandas",
  "numpy",
  "pydantic",
  "scipy",
  "soundfile",
  "yt-dlp",
  "typer",
  "rich",
  "matplotlib",
  "python-docx",
  "pypdf",
  "PyYAML",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff",
]
nlp = [
  "spacy",
  "scikit-learn",
  "regex",
  "rapidfuzz",
  "textstat",
  "yake",
  "nltk",
  "snorkel",
]
privacy = [
  "presidio-analyzer",
  "presidio-anonymizer",
]
embeddings = [
  "sentence-transformers",
  "faiss-cpu",
  "chromadb",
]
text-emotion = [
  "transformers",
  "torch",
  "datasets",
  "evaluate",
  "sentence-transformers",
]
audio = [
  "faster-whisper",
  "librosa",
  "torchaudio",
  "ffmpeg-python",
]
diarization = [
  "pyannote.audio",
]
video = [
  "opencv-python",
  "scenedetect",
  "moviepy",
  "mediapipe",
  "deepface",
  "torchvision",
]
prosody = [
  "opensmile",
]
training = [
  "pytorch-lightning",
  "mlflow",
  "pyarrow",
  "orjson",
]
evaluation = [
  "deepeval",
  "promptfoo",
]
retrieval = [
  "faiss-cpu",
  "rank-bm25",
]
visualization = [
  "seaborn",
  "plotly",
]
nlp = [
  "spacy",
  "scikit-learn",
  "rapidfuzz",
  "textstat",
  "yake",
]
privacy = [
  "presidio-analyzer",
  "presidio-anonymizer",
]
embeddings = [
  "sentence-transformers",
  "faiss-cpu",
  "chromadb",
]
text-emotion = [
  "transformers",
  "torch",
  "datasets",
  "evaluate",
]
audio = [
  "faster-whisper",
  "librosa",
  "torchaudio",
  "ffmpeg-python",
]
diarization = [
  "pyannote.audio",
]
video = [
  "opencv-python",
  "scenedetect",
  "moviepy",
]
prosody = [
  "opensmile",
]

[project.scripts]
earnings-call-sentiment = "earnings_call_sentiment.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["parser", "features", "pipeline"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
earnings_call_sentiment = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 140

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402", "F401", "F541", "F841"]
"tools/transcript_downloader/*.py" = ["F401", "F841"]
