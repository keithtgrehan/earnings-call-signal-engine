schema_version: llm_backends.v1
llm:
  enabled: false
  provider: dry_run
  mode: dry_run
  allow_network: false
  require_live_flag: true
  require_quote_evidence: true
  require_json_schema: true
  canonical_output: false
  auto_promote_gold: false
  output_dir: artifacts/llm
  report_dir: reports/llm
  max_calls: 10
  max_cost_usd: 5.00
  allowed_use_cases:
    - reviewer_support
    - extraction_benchmark
providers:
  dry_run:
    provider_type: dry_run
    enabled: true
    default_model: dry-run-signal-engine-v1
    model_env: ""
    api_key_env: ""
    base_url_env: ""
    notes: "Offline fake provider for tests and smoke checks. It never performs network calls."
  claude:
    provider_type: anthropic_messages_api
    enabled: false
    default_model: claude-sonnet-4-5
    model_env: CLAUDE_MODEL
    api_key_env: ANTHROPIC_API_KEY
    base_url_env: ANTHROPIC_BASE_URL
    notes: "Optional reviewer-support backend only. Live calls require --live and SIGNAL_ENGINE_LLM_LIVE=1."
  glm52:
    provider_type: openai_compatible_chat_completions
    enabled: false
    default_model: glm-5.2
    model_env: GLM_MODEL
    api_key_env: ZAI_API_KEY
    base_url_env: ZAI_BASE_URL
    notes: "Optional extraction-benchmark/reviewer-support backend only. Live calls require --live and SIGNAL_ENGINE_LLM_LIVE=1."
  openai_compatible:
    provider_type: openai_compatible_chat_completions
    enabled: false
    default_model: ""
    model_env: OPENAI_MODEL
    api_key_env: OPENAI_API_KEY
    base_url_env: OPENAI_BASE_URL
    notes: "Generic OpenAI-compatible endpoint for benchmark scaffolding. Live calls require --live and SIGNAL_ENGINE_LLM_LIVE=1."
