registry_version: affective_dataset_registry_v1
entries:
  - name: GoEmotions
    modality: text
    task: text affect annotation benchmark
    license: license review required
    allowed_use: Benchmark-only label taxonomy reference.
    benchmark_only_default: true
    training_allowed: false
    raw_data_allowed: false
    sensitive_biometric_risk: false
    workplace_education_prohibited_use: true
    signal_engine_relevance: Research caution only; no trading or alpha claims.
    dating_app_relevance: Safe only with opt-in consent and privacy-preserving user-owned review.
    evidence_provenance_requirements: Dataset version, license notes, benchmark split, and label mapping notes are required.
    failure_modes: Annotator labels can be culturally variable and are not internal-state facts.
    legal_notes: Observable cues only; no true internal emotion inference; no deception detection; no biometric identity inference; workplace/education emotion inference prohibited.
    source_url: https://github.com/google-research/google-research/tree/master/goemotions
