event_study_join_policy_version: event_study_join_policy_v1
description: Metadata join scaffold only. No market data fetch, AR/CAR production calculation, or significance claim.
join_key:
  - ticker
  - fiscal_period
  - call_datetime
  - market_session
required_controls:
  earnings_surprise_status: required
  market_proxy: required
  sector_proxy: required
  confounder_notes: required
gates:
  min_events: 100
  min_gold_labels: 100
  missing_price_data_threshold: 0.05
  significance_claim_allowed: false
cases:
