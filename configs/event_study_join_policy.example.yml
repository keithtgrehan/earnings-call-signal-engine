    fiscal_period: FY2024_Q2
    call_datetime: "2024-08-07T20:30:00Z"
    market_session: after_close
    earnings_surprise_status: not_loaded_metadata_only
    market_proxy: SPY
    sector_proxy: XLI
    confounder_notes: Synthetic example; no price or surprise data fetched.
    gold_signal_join_status: not_ready_missing_gold_gate
