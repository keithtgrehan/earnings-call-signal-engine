registry_version: affective_model_registry_v1
entries:
  - name: transcript-first deterministic cue rules
    modality: text
    task: observable transcript cue extraction
    license: repo-local rules
    allowed_use: Canonical Signal Engine transcript features only; no trading or alpha claims.
    benchmark_only_default: false
    training_allowed: false
    raw_data_allowed: false
    sensitive_biometric_risk: false
    workplace_education_prohibited_use: true
    signal_engine_relevance: Canonical deterministic baseline; no trading or alpha claims.
    dating_app_relevance: Safe only with opt-in consent and privacy-preserving user-owned review.
    evidence_provenance_requirements: Evidence spans, transcript window references, source rights, and deterministic rule version are required.
    failure_modes: Over-sensitive cue rules can overflag hedging, pressure, or politeness without context.
    legal_notes: Observable cues only; no true internal emotion inference; no deception detection; no biometric identity inference; workplace/education emotion inference prohibited.
    source_url: repo-local:src/signal_engine/agent1_extraction.py
  - name: openSMILE eGeMAPS
    modality: audio
    task: acoustic metadata extraction
    license: license review required
    allowed_use: Research benchmark for acoustic metadata on rights-cleared flagged windows only.
    benchmark_only_default: true
    training_allowed: false
    raw_data_allowed: false
    sensitive_biometric_risk: true
    workplace_education_prohibited_use: true
    signal_engine_relevance: Optional reviewer-support context only; no trading or alpha claims.
    dating_app_relevance: Safe only with opt-in consent and privacy-preserving user-owned review.
    evidence_provenance_requirements: Rights record, window ID, extractor version, confidence, and feature list are required.
    failure_modes: Voice quality, audio compression, accents, disability, microphone quality, and diarization errors can distort metadata.
    legal_notes: Observable cues only; no true internal emotion inference; no deception detection; no biometric identity inference; workplace/education emotion inference prohibited.
    source_url: https://audeering.github.io/opensmile/
  - name: wav2vec HuBERT WavLM
    modality: audio
    task: speech representation research
    license: license review required
    allowed_use: Benchmark comparison for speech metadata research only.
    benchmark_only_default: true
    training_allowed: false
    raw_data_allowed: false
    sensitive_biometric_risk: true
    workplace_education_prohibited_use: true
    signal_engine_relevance: Optional benchmark reference only; no trading or alpha claims.
    dating_app_relevance: Safe only with opt-in consent and privacy-preserving user-owned review.
    evidence_provenance_requirements: Rights record, model version, window ID, feature schema, and confidence notes are required.
    failure_modes: Representation drift and dataset mismatch can create misleading cue summaries.
    legal_notes: Observable cues only; no true internal emotion inference; no deception detection; no biometric identity inference; workplace/education emotion inference prohibited.
    source_url: https://huggingface.co/models?pipeline_tag=automatic-speech-recognition
  - name: emotion2vec
    modality: audio
    task: affective representation research
    license: license review required
    allowed_use: Research benchmark only; output labels must be blocked or downgraded to metadata review notes.
    benchmark_only_default: true
    training_allowed: false
    raw_data_allowed: false
    sensitive_biometric_risk: true
    workplace_education_prohibited_use: true
    signal_engine_relevance: Research caution only; no trading or alpha claims.
    dating_app_relevance: Safe only with opt-in consent and privacy-preserving user-owned review.
    evidence_provenance_requirements: Rights record, benchmark split, source license notes, and blocked-output log are required.
    failure_modes: Label names can anchor reviewers and imply internal-state certainty.
    legal_notes: Observable cues only; no true internal emotion inference; no deception detection; no biometric identity inference; workplace/education emotion inference prohibited.
    source_url: https://github.com/ddlBoJack/emotion2vec
  - name: MediaPipe
    modality: video
    task: pose and landmark metadata extraction
    license: license review required
    allowed_use: Observable cues only on rights-cleared flagged windows.
    benchmark_only_default: true
    training_allowed: false
    raw_data_allowed: false
    sensitive_biometric_risk: true
    workplace_education_prohibited_use: true
    signal_engine_relevance: Optional reviewer-support metadata only; no trading or alpha claims.
    dating_app_relevance: not_relevant
    evidence_provenance_requirements: Rights record, window ID, model version, feature list, and blocked-use notes are required.
    failure_modes: Camera angle, lighting, occlusion, and frame sampling can distort pose and gaze metadata.
    legal_notes: Observable cues only; no true internal emotion inference; no deception detection; no biometric identity inference; workplace/education emotion inference prohibited.
    source_url: https://ai.google.dev/edge/mediapipe/solutions/guide
  - name: OpenFace
    modality: video
    task: action unit and head-pose metadata extraction
    license: license review required
    allowed_use: Observable cues only on rights-cleared flagged windows.
    benchmark_only_default: true
    training_allowed: false
    raw_data_allowed: false
    sensitive_biometric_risk: true
    workplace_education_prohibited_use: true
    signal_engine_relevance: Optional reviewer-support metadata only; no trading or alpha claims.
    dating_app_relevance: not_relevant
    evidence_provenance_requirements: Rights record, window ID, extractor version, confidence, and blocked-use notes are required.
    failure_modes: Face tracking failures and camera setup can produce misleading action-unit metadata.
    legal_notes: Observable cues only; no true internal emotion inference; no deception detection; no biometric identity inference; workplace/education emotion inference prohibited.
    source_url: https://github.com/TadasBaltrusaitis/OpenFace
  - name: MMPose
    modality: video
    task: pose landmark metadata extraction
    license: license review required
    allowed_use: Observable cues only on rights-cleared flagged windows.
    benchmark_only_default: true
    training_allowed: false
    raw_data_allowed: false
    sensitive_biometric_risk: true
    workplace_education_prohibited_use: true
    signal_engine_relevance: Optional reviewer-support metadata only; no trading or alpha claims.
    dating_app_relevance: not_relevant
    evidence_provenance_requirements: Rights record, window ID, model version, feature list, and blocked-use notes are required.
    failure_modes: Pose estimation can fail under occlusion, low resolution, and domain shift.
    legal_notes: Observable cues only; no true internal emotion inference; no deception detection; no biometric identity inference; workplace/education emotion inference prohibited.
    source_url: https://github.com/open-mmlab/mmpose
  - name: BYOK reviewer layer
    modality: multimodal
    task: fixed-bundle reviewer support
    license: user-provided provider terms
    allowed_use: Reviewer-support only over fixed evidence and observable metadata; no canonical labels.
    benchmark_only_default: false
    training_allowed: false
    raw_data_allowed: false
    sensitive_biometric_risk: true
    workplace_education_prohibited_use: true
    signal_engine_relevance: Reviewer-support layer only; no trading or alpha claims.
    dating_app_relevance: Safe only with opt-in consent and privacy-preserving user-owned review.
    evidence_provenance_requirements: Prompt pack version, evidence IDs, source rights, model/provider metadata, and citation checks are required.
    failure_modes: Reviewer outputs can hallucinate or overstate affective claims without strict schemas and red-line checks.
    legal_notes: Observable cues only; no true internal emotion inference; no deception detection; no biometric identity inference; workplace/education emotion inference prohibited.
    source_url: repo-local:configs/byok_reviewer.example.yml
